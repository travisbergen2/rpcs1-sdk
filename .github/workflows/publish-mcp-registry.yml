name: Publish MCP Registry Metadata

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MCP publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" |
            tar xz mcp-publisher

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata
        # Idempotent: tolerate exactly the already-published case so a
        # re-dispatch never blocks the other servers below; any other
        # error still fails the step.
        run: |
          out=$(./mcp-publisher publish 2>&1) || {
            echo "$out"
            echo "$out" | grep -q "duplicate version" || exit 1
            echo "::notice::tuner version already in the registry — skipping"
            exit 0
          }
          echo "$out"

      - name: Publish second-brain metadata
        working-directory: packages/vault-mcp
        run: |
          out=$(../../mcp-publisher publish 2>&1) || {
            echo "$out"
            echo "$out" | grep -q "duplicate version" || exit 1
            echo "::notice::second-brain version already in the registry — skipping"
            exit 0
          }
          echo "$out"
